name = micronode_chisel
title = Micronode Chisel
description = Sauerbraten-style sub-node editing. A 1 m node becomes a 16^3 micronode grid (6.25 cm) with grid-snapped push/pull brushes, surface-only rendering, shape-aware collision (slabs, stairs, panels, posts) and blueprint copy/paste.
optional_depends = default, basenodes
